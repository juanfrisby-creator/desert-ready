<script>
// Each item: domain | question | correct answer | three distractors | explanation.
const raw = `
0|A child solves a puzzle with a hint but cannot solve it alone. What should the teacher do next?~Un niño resuelve un rompecabezas con una pista, pero no solo. ¿Qué debe hacer el docente?|Gradually fade the hints~Retirar las pistas gradualmente|Solve every puzzle for the child~Resolver todos los rompecabezas por él|Assign much harder puzzles~Asignar rompecabezas mucho más difíciles|Wait until next year~Esperar hasta el próximo año|Fading support builds independence within the learner's current reach.~Retirar el apoyo favorece la autonomía en tareas que el alumno casi domina.
0|Which task best shows transfer of learning?~¿Qué tarea demuestra mejor la transferencia del aprendizaje?|Use a familiar strategy in a new context~Usar una estrategia conocida en un contexto nuevo|Repeat a worked example~Repetir un ejemplo resuelto|Copy a definition~Copiar una definición|Identify the lesson date~Identificar la fecha de la lección|Transfer is the application of prior learning in an unfamiliar situation.~La transferencia consiste en aplicar aprendizajes previos en una situación nueva.
0|A student can compare fractions with strips but struggles with symbols. What next?~Un alumno compara fracciones con tiras, pero tiene dificultades con los símbolos. ¿Qué sigue?|Connect each strip to its matching notation~Relacionar cada tira con su notación|Remove all models immediately~Retirar todos los modelos de inmediato|Teach decimals instead~Enseñar decimales|Grade only speed~Calificar solo la rapidez|Explicit links connect concrete representations to abstract notation.~Los vínculos explícitos conectan las representaciones concretas con la notación abstracta.
0|Which strategy helps students monitor their own comprehension?~¿Qué estrategia ayuda a los alumnos a supervisar su comprensión?|Pause to summarize and flag confusion~Pausar para resumir y señalar dudas|Read every page faster~Leer cada página más rápido|Copy each paragraph~Copiar cada párrafo|Count pages read~Contar las páginas leídas|Summarizing and flagging confusion makes understanding visible to the learner.~Resumir y señalar dudas permite al alumno reconocer lo que comprende.
0|How can a teacher tap adolescents' growing need for autonomy?~¿Cómo puede un docente aprovechar la creciente necesidad de autonomía de los adolescentes?|Offer meaningful choices within a shared goal~Ofrecer opciones significativas con una meta común|Let students opt out of all work~Permitir que omitan todo el trabajo|Choose every step for them~Elegir cada paso por ellos|Reward only silent compliance~Premiar solo la obediencia silenciosa|Structured choice supports agency while preserving a common learning goal.~Las opciones estructuradas fomentan la autonomía y mantienen una meta común.
0|Before starting ecosystems, how can a teacher uncover misconceptions?~Antes de enseñar ecosistemas, ¿cómo puede un docente detectar ideas erróneas?|Ask students to draw and explain a food web~Pedir que dibujen y expliquen una red trófica|Assign the final project immediately~Asignar de inmediato el proyecto final|Provide a completed diagram to copy~Dar un diagrama resuelto para copiar|Ask if everyone is ready~Preguntar si todos están listos|Explanations reveal existing mental models and misconceptions.~Las explicaciones revelan modelos mentales previos e ideas erróneas.
0|Which routine best strengthens long-term recall?~¿Qué rutina fortalece más la memoria a largo plazo?|Recall material across several short sessions~Evocar el contenido en varias sesiones breves|Reread the same page for an hour~Releer la misma página durante una hora|Highlight every sentence once~Subrayar cada oración una vez|Copy vocabulary in one sitting~Copiar el vocabulario en una sola sesión|Spaced retrieval strengthens the ability to recall material later.~La recuperación espaciada fortalece la capacidad de recordar después.
0|A learner says, “I’m just bad at math.” Which response is most helpful?~Un alumno dice: «Soy malo para las matemáticas». ¿Qué respuesta ayuda más?|Name a strategy that worked and plan the next step~Identificar una estrategia que funcionó y planear el siguiente paso|Say everyone else found it easy~Decir que a todos los demás les pareció fácil|Praise innate talent~Elogiar el talento innato|Remove challenging problems indefinitely~Eliminar los problemas difíciles indefinidamente|Specific feedback shows how strategies and practice contribute to progress.~La retroalimentación específica muestra cómo las estrategias y la práctica favorecen el progreso.
0|Which activity best uses play to develop early language?~¿Qué actividad aprovecha mejor el juego para desarrollar el lenguaje temprano?|Run a pretend market with roles and conversation~Organizar un mercado imaginario con roles y diálogo|Sort silent worksheets by color~Clasificar fichas por color sin hablar|Copy price tags only~Copiar únicamente las etiquetas de precios|Listen to rules for the whole period~Escuchar reglas durante toda la clase|Dramatic play gives children a meaningful reason to communicate.~El juego dramático da a los niños un motivo significativo para comunicarse.
0|Which observation calls for collecting more information before drawing conclusions?~¿Qué observación requiere recopilar más información antes de sacar conclusiones?|A student is quiet during a single group activity~Un alumno permanece callado en una sola actividad grupal|A semester of work documents a recurring pattern~Un semestre de trabajos documenta un patrón recurrente|Several teachers report the same repeated behavior~Varios docentes informan la misma conducta repetida|Multiple assessments show consistent results~Varias evaluaciones muestran resultados consistentes|One observation cannot establish a stable developmental or learning pattern.~Una sola observación no permite establecer un patrón de desarrollo o aprendizaje.
0|What supports a newcomer during a science discussion?~¿Qué apoya a un recién llegado durante un diálogo de ciencias?|Use diagrams, rehearsal with a partner, and sentence frames~Usar diagramas, ensayos en pareja y estructuras de oración|Excuse the student from science~Eximirlo de ciencias|Require spontaneous public answers only~Exigir solo respuestas públicas espontáneas|Replace science with grammar drills~Sustituir ciencias por ejercicios de gramática|Multimodal supports increase access to the same science ideas.~Los apoyos multimodales dan acceso a las mismas ideas científicas.
0|What is an effective support for a student who loses track of multistep directions?~¿Qué apoyo es eficaz para un alumno que pierde el hilo de instrucciones de varios pasos?|Provide a visible checklist and model its use~Dar una lista visible y modelar su uso|Repeat all directions more rapidly~Repetir todas las instrucciones más rápido|Remove written supports~Quitar los apoyos escritos|Make the instructions longer~Alargar las instrucciones|A visible checklist reduces memory demands and supports independent monitoring.~Una lista visible reduce la carga de memoria y apoya el seguimiento autónomo.
0|What is the best sign a student is ready for less scaffolding?~¿Cuál es la mejor señal de que un alumno necesita menos andamiaje?|They apply the strategy independently on several tasks~Aplica la estrategia de forma autónoma en varias tareas|They copied the model accurately once~Copió el modelo correctamente una vez|They report that the teacher is helpful~Dice que el docente ayuda|They finish faster with hints~Termina más rápido con pistas|Consistent independent use shows that support can be faded.~El uso autónomo y constante indica que se puede retirar el apoyo.
0|A student reads accurately but cannot explain the meaning. What should be assessed next?~Un alumno lee con precisión, pero no puede explicar el significado. ¿Qué conviene evaluar después?|Vocabulary, background knowledge, and comprehension~Vocabulario, conocimientos previos y comprensión|Handwriting speed~Rapidez de escritura a mano|Only letter names~Solo los nombres de las letras|Only oral reading rate~Solo la velocidad de lectura oral|Accurate decoding is one component of reading and does not establish comprehension.~La decodificación precisa es un componente de la lectura y no demuestra comprensión.
0|How can students generalize a newly learned self-regulation routine?~¿Cómo pueden generalizar los alumnos una rutina de autorregulación recién aprendida?|Practice it in several authentic settings~Practicarla en varios contextos reales|Use it only at one desk~Usarla solo en un pupitre|Memorize the routine's title~Memorizar el nombre de la rutina|Watch the teacher use it once~Observar al docente usarla una vez|Varied practice helps learners recognize when and where a strategy applies.~La práctica variada ayuda a reconocer cuándo y dónde se aplica una estrategia.
1|Which assessment best aligns with a goal of defending a claim using evidence?~¿Qué evaluación se alinea mejor con defender una afirmación con evidencia?|Write an argument using sources~Escribir un argumento con fuentes|List the chapter headings~Enumerar los títulos del capítulo|Define the word claim~Definir la palabra afirmación|Copy a paragraph~Copiar un párrafo|The task directly elicits the skill named in the goal.~La tarea exige directamente la habilidad indicada en la meta.
1|Exit tickets show most students confuse area and perimeter. What should happen next?~Las respuestas de salida muestran que la mayoría confunde área y perímetro. ¿Qué conviene hacer?|Reteach with contrasting visual models and reassess~Volver a enseñar con modelos visuales contrastantes y evaluar de nuevo|Record a grade and move on~Registrar una nota y continuar|Assign unrelated practice~Asignar práctica de otro tema|Repeat the same lecture without a check~Repetir la misma exposición sin verificar|Formative evidence should guide a targeted adjustment and follow-up check.~La evidencia formativa orienta un ajuste específico y una comprobación posterior.
1|Which tool best improves consistency across two essay scorers?~¿Qué herramienta mejora la consistencia entre dos evaluadores de ensayos?|A shared rubric with anchor essays~Una rúbrica común con ensayos de referencia|Independent rules for each scorer~Reglas distintas para cada evaluador|Student names on all papers~Los nombres de los alumnos en todos los trabajos|A longer essay prompt~Una consigna más larga|A common rubric and examples help scorers interpret criteria similarly.~Una rúbrica común y ejemplos ayudan a interpretar los criterios de manera similar.
1|An assessment scores students consistently but measures the wrong skill. What is the primary problem?~Una evaluación da resultados consistentes, pero mide otra habilidad. ¿Cuál es el problema principal?|Validity~Validez|Reliability~Confiabilidad|Attendance~Asistencia|Test length~Duración de la prueba|Validity concerns whether evidence supports the intended interpretation of scores.~La validez se refiere a si la evidencia respalda la interpretación prevista de los resultados.
1|Which prompt elicits the highest level of reasoning?~¿Qué consigna exige el mayor nivel de razonamiento?|Compare two solutions and defend which is more efficient~Comparar dos soluciones y justificar cuál es más eficiente|Name the operation~Nombrar la operación|Copy the equation~Copiar la ecuación|State the answer only~Indicar solo la respuesta|Evaluation requires applying criteria and justifying a judgment.~Evaluar requiere aplicar criterios y justificar un juicio.
1|How should a teacher begin backward design?~¿Cómo debe comenzar un docente la planificación inversa?|Identify what students should be able to do~Identificar lo que los alumnos deben poder hacer|Pick the worksheets first~Elegir primero las fichas|Schedule the class celebration~Programar la celebración de la clase|Assign grades before planning~Asignar calificaciones antes de planificar|Backward design starts with desired results, then determines evidence and activities.~La planificación inversa comienza por los resultados deseados y luego define evidencias y actividades.
1|What makes peer feedback most productive?~¿Qué hace más productiva la retroalimentación entre pares?|Model feedback with specific success criteria~Modelar la retroalimentación con criterios concretos|Ask peers to give only a grade~Pedir que asignen solo una nota|Ask for comments with no criteria~Pedir comentarios sin criterios|Skip time for revision~Omitir el tiempo de revisión|Criteria make feedback actionable, and modeling shows students how to use them.~Los criterios permiten actuar y el modelado enseña cómo aplicarlos.
1|What is the main purpose of a diagnostic assessment before a unit?~¿Cuál es el propósito principal de una evaluación diagnóstica antes de una unidad?|Identify prior knowledge and learning needs~Identificar conocimientos previos y necesidades de aprendizaje|Report end-of-unit mastery~Informar el dominio al final de la unidad|Rank teachers~Clasificar a los docentes|Replace all instruction~Sustituir toda la enseñanza|Diagnostic evidence informs the starting point for instruction.~La evidencia diagnóstica orienta el punto de partida de la enseñanza.
1|Which grouping strategy supports instruction after a quick skills check?~¿Qué estrategia de agrupamiento apoya la enseñanza después de comprobar habilidades?|Create temporary groups by current need~Crear grupos temporales según las necesidades actuales|Keep ability groups fixed all year~Mantener grupos fijos por nivel todo el año|Group students by birthday~Agrupar por fecha de nacimiento|Give all groups identical remediation~Dar el mismo refuerzo a todos los grupos|Flexible grouping changes as evidence of learning changes.~El agrupamiento flexible cambia según la evidencia del aprendizaje.
1|A student already meets the lesson goal. What is the best next task?~Un alumno ya cumple la meta de la lección. ¿Cuál es la mejor tarea siguiente?|Apply the skill to a more complex problem~Aplicar la habilidad a un problema más complejo|Do more identical items~Hacer más ejercicios idénticos|Wait quietly each day~Esperar en silencio cada día|Skip all later instruction~Omitir toda enseñanza posterior|Extension deepens reasoning and application beyond initial mastery.~La ampliación profundiza el razonamiento y la aplicación después del dominio inicial.
1|Which direction supports productive group work?~¿Qué instrucción apoya un trabajo grupal productivo?|Give roles and ask each person to explain the result~Asignar roles y pedir a cada persona que explique el resultado|Let one student handle everything~Dejar que un alumno haga todo|Grade only the loudest speaker~Calificar solo a quien habla más fuerte|Avoid giving a shared goal~Evitar dar una meta común|Roles and individual accountability distribute participation and responsibility.~Los roles y la responsabilidad individual distribuyen la participación y las tareas.
1|When teaching a new problem-solving procedure, what does a think-aloud reveal?~Al enseñar un procedimiento nuevo, ¿qué revela pensar en voz alta?|The decisions behind each step~Las decisiones detrás de cada paso|The final grade~La calificación final|Only the student's handwriting~Solo la letra del alumno|Which students work fastest~Qué alumnos trabajan más rápido|Thinking aloud models the normally invisible reasoning behind an action.~Pensar en voz alta muestra el razonamiento que normalmente no se ve.
1|Transitions consistently waste class time. What should the teacher do first?~Las transiciones consumen tiempo de clase repetidamente. ¿Qué debe hacer primero el docente?|Teach and practice a clear transition routine~Enseñar y practicar una rutina clara de transición|Increase homework for everyone~Aumentar la tarea para todos|Stop all transitions indefinitely~Eliminar las transiciones indefinidamente|Change the routine without explaining it~Cambiar la rutina sin explicarla|Explicitly taught routines prevent predictable confusion.~Las rutinas enseñadas explícitamente previenen confusiones previsibles.
1|Which response best redirects a minor off-task behavior during independent work?~¿Qué respuesta redirige mejor una distracción leve durante el trabajo autónomo?|Use a quiet proximity cue and restate the expectation if needed~Acercarse discretamente y recordar la expectativa si hace falta|Stop class for a public reprimand~Detener la clase para reprender en público|Remove the student immediately~Retirar al alumno de inmediato|Ignore it until the end of the week~Ignorarlo hasta el fin de semana|A brief, discreet cue preserves learning time and student dignity.~Una señal breve y discreta conserva el tiempo de aprendizaje y la dignidad.
1|What is most useful when analyzing why a behavior recurs?~¿Qué es más útil al analizar por qué se repite una conducta?|Record what happens before and after the behavior~Registrar qué ocurre antes y después de la conducta|Ask peers to guess the student's motive~Pedir a compañeros que adivinen el motivo|Record only the student's grades~Registrar solo sus notas|Change consequences daily without tracking~Cambiar las consecuencias a diario sin registrar|Antecedent and consequence patterns help identify the behavior's possible function.~Los patrones de antecedentes y consecuencias ayudan a identificar la posible función de la conducta.
1|Which classroom practice increases access during a discussion?~¿Qué práctica mejora el acceso durante un diálogo en clase?|Provide thinking time and a chance to rehearse with a partner~Dar tiempo para pensar y ensayar en pareja|Call only on the quickest volunteers~Llamar solo a quienes levantan la mano primero|Accept only one mode of participation~Aceptar una sola forma de participar|Eliminate discussion prompts~Eliminar las preguntas de discusión|Thinking and rehearsal time broaden participation without lowering expectations.~El tiempo para pensar y ensayar amplía la participación y mantiene las expectativas.
1|Which feedback is most actionable after a lab report?~¿Qué retroalimentación es más útil después de un informe de laboratorio?|Connect your conclusion to two measurements from your table~Vincula tu conclusión con dos mediciones de tu tabla|Try harder~Esfuérzate más|Great job~Buen trabajo|This is a B~Esto merece una B|Specific feedback names a next step linked to the learning goal.~La retroalimentación específica indica un paso siguiente vinculado a la meta.
1|Students disagree about a text's theme. What should the teacher ask next?~Los alumnos discrepan sobre el tema de un texto. ¿Qué debe preguntar el docente?|Which passages support each interpretation?~¿Qué pasajes respaldan cada interpretación?|Who chose the most popular theme?~¿Quién eligió el tema más popular?|Which answer sounds longest?~¿Qué respuesta parece más larga?|Can we skip the evidence?~¿Podemos omitir la evidencia?|Textual evidence helps students evaluate interpretations on their merits.~La evidencia textual ayuda a evaluar cada interpretación según su fundamento.
1|Which is an accommodation when decoding is not the skill being assessed?~¿Cuál es una adaptación cuando la decodificación no es la habilidad evaluada?|Provide text-to-speech for the directions and content as appropriate~Ofrecer lectura en voz alta digital según corresponda|Replace the target skill with an easier skill~Cambiar la habilidad objetivo por una más fácil|Remove the learning goal~Eliminar la meta de aprendizaje|Score solely on attendance~Calificar solo por asistencia|An accommodation changes access while preserving the intended construct.~Una adaptación cambia el acceso y conserva la habilidad que se busca medir.
1|Which move best checks understanding during a lesson?~¿Qué acción comprueba mejor la comprensión durante una lección?|Have every student respond to a diagnostic prompt~Pedir que cada alumno responda a una pregunta diagnóstica|Ask whether everyone understands~Preguntar si todos entienden|Call only on the student who volunteers~Llamar solo al alumno que se ofrece|Wait for the final exam~Esperar hasta el examen final|Responses from everyone provide broader evidence for adjusting instruction.~Las respuestas de todos aportan evidencia más amplia para ajustar la enseñanza.
1|A test reports the 70th percentile. What does that mean?~Una prueba informa el percentil 70. ¿Qué significa?|The score was at or above roughly 70% of the comparison group's scores~La puntuación igualó o superó aproximadamente al 70% del grupo de referencia|Exactly 70% of items were correct~Se acertó exactamente el 70% de los ítems|The student mastered 70 standards~El alumno dominó 70 estándares|The score rose by 70 points~La puntuación subió 70 puntos|A percentile expresses relative standing in a comparison group.~Un percentil indica la posición relativa en un grupo de referencia.
1|Which task best assesses whether students can conduct an investigation?~¿Qué tarea evalúa mejor si los alumnos pueden realizar una investigación?|Plan and carry out a fair test and analyze results~Planear y realizar una prueba controlada y analizar los resultados|Memorize the steps in isolation~Memorizar los pasos de forma aislada|Identify a lab coat~Identificar una bata de laboratorio|Copy a data table~Copiar una tabla de datos|A performance task directly demonstrates the investigation skill.~Una tarea de desempeño demuestra directamente la habilidad de investigar.
1|How can a teacher make a word problem fairer when the goal is numerical reasoning?~¿Cómo puede un docente hacer más equitativo un problema verbal si la meta es el razonamiento numérico?|Simplify incidental language while preserving the mathematics~Simplificar el lenguaje accesorio y conservar las matemáticas|Replace the mathematics with easier operations~Sustituir las operaciones por otras más fáciles|Add obscure vocabulary~Añadir vocabulario poco común|Award full credit before students answer~Dar crédito completo antes de que respondan|Removing irrelevant language barriers makes scores more reflective of the intended skill.~Eliminar barreras lingüísticas ajenas a la tarea hace que los resultados reflejen mejor la habilidad objetivo.
1|Which approach best supports students' academic language in history?~¿Qué enfoque apoya mejor el lenguaje académico en historia?|Model how to compare sources using disciplinary language~Modelar cómo comparar fuentes con el lenguaje de la disciplina|Avoid historical terms~Evitar los términos históricos|Assign vocabulary lists without context~Asignar listas sin contexto|Grade only grammar~Calificar solo la gramática|Modeling language in context connects vocabulary to disciplinary reasoning.~Modelar el lenguaje en contexto vincula el vocabulario con el razonamiento disciplinario.
1|Which example shows a criterion-referenced interpretation?~¿Qué ejemplo muestra una interpretación referida a criterios?|The student met four of five rubric criteria~El alumno cumplió cuatro de cinco criterios de la rúbrica|The student scored above most classmates~El alumno superó a la mayoría del grupo|The student placed second in class~El alumno quedó segundo en la clase|The student scored at the 80th percentile~El alumno obtuvo el percentil 80|Criterion-referenced interpretations compare performance to defined expectations.~Estas interpretaciones comparan el desempeño con expectativas definidas.
2|A family prefers to discuss progress in Spanish. What is the best approach?~Una familia prefiere hablar del progreso en español. ¿Cuál es el mejor enfoque?|Arrange qualified interpretation and invite the family's input~Organizar interpretación calificada e invitar a la familia a opinar|Ask the student to interpret sensitive details~Pedir al alumno que interprete detalles delicados|Send only an English report~Enviar solo un informe en inglés|Cancel the meeting~Cancelar la reunión|Language access supports meaningful participation and protects sensitive communication.~El acceso lingüístico favorece la participación y protege la comunicación delicada.
2|A parent asks to see another student's grade. How should the teacher respond?~Un familiar pide ver la nota de otro alumno. ¿Cómo debe responder el docente?|Discuss their own child's progress and protect the other student's record~Hablar del progreso de su hijo y proteger el expediente del otro alumno|Share the full gradebook~Compartir todo el registro de notas|Give the other grade verbally~Decir la otra nota en voz alta|Send a screenshot of both records~Enviar una captura de ambos registros|Individual education records require confidentiality.~Los expedientes educativos individuales requieren confidencialidad.
2|What makes a professional learning community meeting most useful?~¿Qué hace más útil una reunión de una comunidad profesional de aprendizaje?|Analyze common student work and agree on a follow-up strategy~Analizar trabajos comparables y acordar una estrategia de seguimiento|Compare classroom decorations~Comparar decoraciones|Review only the meeting calendar~Revisar solo el calendario|Select activities without examining outcomes~Elegir actividades sin examinar resultados|Collaborative review of evidence links professional learning to student needs.~La revisión colaborativa de evidencias vincula el aprendizaje profesional con las necesidades del alumnado.
2|A teacher wants to improve discussion equity. What is a good first step?~Un docente quiere mejorar la equidad de participación. ¿Cuál es un buen primer paso?|Track who participates and in what ways~Registrar quién participa y de qué manera|Assume the most vocal students represent everyone~Suponer que los más habladores representan a todos|Remove all discussions~Eliminar los diálogos|Count only questions asked by the teacher~Contar solo las preguntas del docente|A baseline makes participation patterns visible and helps evaluate changes.~Una línea de base muestra los patrones de participación y permite evaluar cambios.
2|What is the general education teacher's role when a student has an IEP?~¿Cuál es el papel del docente de educación general cuando un alumno tiene un IEP?|Implement assigned supports and collaborate on progress~Implementar los apoyos asignados y colaborar en el seguimiento|Wait for the specialist to teach all content~Esperar que el especialista enseñe todo|Change services independently~Cambiar los servicios sin consultar|Share the plan with all families~Compartir el plan con todas las familias|Implementing the plan is a coordinated responsibility of the educators serving the student.~Implementar el plan es una responsabilidad coordinada de los educadores que atienden al alumno.
2|Which family outreach is most likely to build partnership?~¿Qué comunicación con la familia tiene más probabilidades de fortalecer la colaboración?|Share a specific strength and ask what works at home~Compartir una fortaleza concreta y preguntar qué funciona en casa|Contact families only after problems~Contactar solo cuando surjan problemas|Send the same grade warning each week~Enviar la misma advertencia de notas cada semana|Ask families to follow a plan without input~Pedir que sigan un plan sin opinar|Two-way communication recognizes family expertise and builds trust.~La comunicación bidireccional reconoce la experiencia familiar y construye confianza.
2|Which question is best suited to classroom action research?~¿Qué pregunta se presta mejor a la investigación-acción en el aula?|How does retrieval practice affect weekly quiz performance in my class?~¿Cómo afecta la práctica de recuperación a los resultados semanales de mi clase?|Which school is best in the country?~¿Cuál es la mejor escuela del país?|Why is education important?~¿Por qué es importante la educación?|What will all students need in twenty years?~¿Qué necesitarán todos los alumnos en veinte años?|Action research examines a specific classroom change using feasible evidence.~La investigación-acción examina un cambio concreto en el aula con evidencia viable.
2|Before using a new digital tool that collects student information, what should a teacher do?~Antes de usar una herramienta digital que recopila datos del alumnado, ¿qué debe hacer el docente?|Check district approval and student privacy procedures~Verificar la aprobación del distrito y los procedimientos de privacidad|Upload the roster to see if it works~Subir la lista para ver si funciona|Use a personal account to bypass review~Usar una cuenta personal para eludir la revisión|Publish sample student data~Publicar datos de ejemplo del alumnado|Reviewing approval and privacy procedures protects student information.~Revisar la aprobación y los procedimientos de privacidad protege la información estudiantil.
2|A colleague gives advice that conflicts with a student's documented accommodations. What should the teacher do?~Un colega aconseja algo que contradice las adaptaciones documentadas de un alumno. ¿Qué debe hacer el docente?|Follow the plan and consult the relevant team~Seguir el plan y consultar al equipo correspondiente|Suspend the accommodations until the next term~Suspender las adaptaciones hasta el próximo período|Follow the informal advice immediately~Seguir de inmediato el consejo informal|Ask the class to vote~Pedir que la clase vote|Documented supports guide instruction, and the team addresses proposed changes.~Los apoyos documentados guían la enseñanza y el equipo analiza cambios propuestos.
2|A teacher gets mixed results after trying a new strategy. What is the best professional response?~Un docente obtiene resultados variados al probar una estrategia. ¿Cuál es la mejor respuesta profesional?|Review evidence by skill and student need, then refine the approach~Revisar la evidencia por habilidad y necesidad, y ajustar el enfoque|Declare the strategy successful from one example~Declarar que funciona a partir de un ejemplo|Stop collecting student work~Dejar de recopilar trabajos|Adopt it permanently without review~Adoptarla para siempre sin revisión|Reflective practice uses multiple sources of evidence to guide improvement.~La práctica reflexiva usa varias fuentes de evidencia para orientar mejoras.
`.trim();
const bank = raw.split('\n').map((line,id)=>{
 const [domain,question,answer,...rest]=line.split('|');
 const explanation=rest.pop();
 return {id,domain:Number(domain),question:question.split('~'),options:[answer,...rest].map(x=>x.split('~')),explanation:explanation.split('~')};
});


</script><script>
const byId = id => document.getElementById(id);
let language = 0;
try { language = Number(localStorage.getItem('desert-ready-language')) || 0; } catch {}
if (![0,1,2].includes(language)) language = 0;
let view = 'home', deck = [], history = [], position = 0, pending = null, streak = 0, best = 0;
let filter = 'all', length = 10, mode = 'practice', draft = '', promptIndex = 0;
const labels = [
 ['Student development & learning','Desarrollo y aprendizaje'],
 ['Assessment, instruction & classroom','Evaluación, enseñanza y aula'],
 ['Professional responsibilities','Responsabilidades profesionales']
];
const prompts = [
 [['Case study','Estudio de caso'],['In a class discussion, 18 of 25 students can state a claim, but only 8 can cite relevant evidence. Several multilingual learners contribute strong ideas orally and struggle to write them. Identify a priority, describe a teaching response, and explain how you will measure progress.','En un diálogo, 18 de 25 alumnos formulan una afirmación, pero solo 8 citan evidencia pertinente. Varios alumnos multilingües aportan buenas ideas oralmente y tienen dificultades al escribirlas. Identifica una prioridad, describe una intervención y explica cómo medirás el progreso.'],['Use the numbers to identify evidence selection as a priority. Model matching evidence to a claim, offer oral rehearsal and sentence frames, then score a new written response for relevant evidence.','Usa las cifras para priorizar la selección de evidencia. Modela cómo vincular evidencia con una afirmación, ofrece ensayo oral y estructuras de oración y luego evalúa la pertinencia de la evidencia en una respuesta nueva.']],
 [['Work product','Producto profesional'],['Draft a message inviting a family to collaborate on a student’s difficulty completing multistep tasks. Include a specific strength, a clear goal, a classroom support, and a way for the family to share input.','Redacta un mensaje para invitar a una familia a colaborar con un alumno que tiene dificultades con tareas de varios pasos. Incluye una fortaleza, una meta clara, un apoyo en clase y una forma de recibir aportes de la familia.'],['Use plain language, identify a strength, describe a measurable goal, explain the checklist you will try, ask what works at home, and propose a follow-up.','Usa lenguaje claro, identifica una fortaleza, describe una meta medible, explica la lista de pasos que probarás, pregunta qué funciona en casa y propone un seguimiento.']],
 [['Case study','Estudio de caso'],['Students can solve ratios in a table but struggle to explain what the numbers mean in a real context. Describe a misconception, a lesson adjustment, and a follow-up task that would show transfer.','Los alumnos resuelven razones en una tabla, pero les cuesta explicar qué significan las cifras en un contexto real. Describe una idea errónea, un ajuste de la lección y una tarea de seguimiento que muestre transferencia.'],['Use a contextual model to connect each table value with its unit, then ask students to explain a new ratio in a different situation and justify the units.','Usa un modelo contextual para vincular cada valor con su unidad. Después, pide que expliquen una nueva razón en otra situación y justifiquen las unidades.']],
 [['Work product','Producto profesional'],['Write a short lesson plan for teaching students to distinguish a strong source from a weak source. Include an observable objective, a model, a supported practice task, and a check for understanding.','Redacta un plan breve para enseñar a distinguir una fuente sólida de una débil. Incluye un objetivo observable, un modelo, una práctica guiada y una comprobación de comprensión.'],['Use explicit criteria such as authorship and corroboration. Model with two sources, guide a comparison, then ask students to independently justify a judgment about a new source.','Usa criterios explícitos como autoría y corroboración. Modela con dos fuentes, guía una comparación y pide que justifiquen de forma autónoma un juicio sobre una fuente nueva.']]
];
const pair = ([en,es]) => language === 2 ? en+'<span class="secondary" lang="es">'+es+'</span>' : language === 1 ? es : en;
const tx = (en,es) => pair([en,es]);
const plain = ([en,es]) => language === 2 ? en+' / '+es : language === 1 ? es : en;
const selected = (a,b) => a===b ? ' selected' : '';
const button = (action,en,es,alt=false,disabled=false) => '<button class="btn'+(alt?' alt':'')+'" data-action="'+action+'"'+(disabled?' disabled':'')+'>'+tx(en,es)+'</button>';
function shuffle(items) {
 const result = [...items];
 for(let i=result.length-1;i>0;i--){
   const j=Math.floor(Math.random()*(i+1));
   [result[i],result[j]]=[result[j],result[i]];
 }
 return result;
}
function start(items,limit) {
 if (!items.length) return;
 deck=shuffle(items).slice(0,limit).map(q=>({...q,order:shuffle([0,1,2,3])}));
 history=[];position=0;pending=null;streak=0;best=0;view='quiz';
}
function render(focus=false) {
 document.documentElement.lang = language===1?'es':'en';
 byId('languages').innerHTML=['EN','ES','EN + ES'].map((name,i)=>'<button aria-pressed="'+(language===i)+'" data-lang="'+i+'">'+name+'</button>').join('');
 byId('tag').innerHTML=tx('Arizona teacher certification','Certificación docente de Arizona');
 byId('title').innerHTML=tx('Ready to teach?','¿Listo para enseñar?');
 byId('intro').innerHTML=tx('Train for the NES Professional Knowledge exams with quick rounds, classroom scenarios, and instant feedback.','Prepárate para los exámenes NES de conocimientos profesionales con rondas rápidas, situaciones de aula y retroalimentación inmediata.');
 const app=byId('app');
 if(view==='home'){
  app.innerHTML='<div class="topline"><div class="eyebrow">'+tx('Practice room','Sala de práctica')+'</div><div class="stat">'+tx(bank.length+' questions · '+prompts.length+' writing drills',bank.length+' preguntas · '+prompts.length+' ejercicios escritos')+'</div></div>'+
  '<h2 id="panel-title" tabindex="-1">'+tx('Build your round','Prepara tu ronda')+'</h2><p class="sub">'+tx('Shared Professional Knowledge practice for Elementary (051) and Secondary (052).','Práctica compartida de conocimientos profesionales para primaria (051) y secundaria (052).')+'</p>'+
  '<div class="fields"><label>'+tx('Topic','Tema')+'<select id="filter"><option value="all">'+plain(['All topics','Todos los temas'])+'</option>'+labels.map((l,i)=>'<option value="'+i+'"'+selected(filter,String(i))+'>'+plain(l)+'</option>').join('')+'</select></label>'+
  '<label>'+tx('Round size','Tamaño de la ronda')+'<select id="length">'+[5,10,25,1000].map(n=>'<option value="'+n+'"'+selected(length,n)+'>'+plain(n===1000?['Full bank','Banco completo']:[n+' questions',n+' preguntas'])+'</option>').join('')+'</select></label>'+
  '<label>'+tx('Mode','Modo')+'<select id="mode"><option value="practice">'+plain(['Practice · instant feedback','Práctica · retroalimentación inmediata'])+'</option><option value="mock"'+selected(mode,'mock')+'>'+plain(['Challenge · review at the end','Desafío · revisión al final'])+'</option></select></label></div>'+
  '<div class="actions">'+button('start','Start quiz →','Comenzar →')+button('writing','Writing drills','Ejercicios escritos',true)+'</div><p class="hint">'+tx('Questions and choices shuffle every round. Topic rounds use up to the available number of questions.','Las preguntas y opciones se mezclan en cada ronda. Las rondas por tema usan hasta el número de preguntas disponible.')+'</p>';
 }else if(view==='quiz'){
  const q=deck[position];
  const locked=pending!==null && mode==='practice';
  app.innerHTML='<div class="topline"><div class="eyebrow">'+pair(labels[q.domain])+'</div><div class="statrow"><span class="stat">'+(position+1)+' / '+deck.length+'</span>'+(mode==='practice'?'<span class="stat">'+tx('🔥 Streak '+streak,'🔥 Racha '+streak)+'</span>':'')+'</div></div>'+
  '<div class="progress" role="progressbar" aria-label="'+plain(['Round progress','Progreso de la ronda'])+'" aria-valuemin="0" aria-valuemax="'+deck.length+'" aria-valuenow="'+history.length+'"><i style="width:'+100*history.length/deck.length+'%"></i></div>'+
  '<h2 id="panel-title" tabindex="-1">'+pair(q.question)+'</h2><div class="options">'+q.order.map((n,i)=>{
   const state=locked?(n===0?' correct':n===pending?' wrong':''):pending===n?' correct':'';
   return '<button class="choice'+state+'" data-answer="'+n+'" aria-pressed="'+(n===pending)+'"'+(locked?' disabled':'')+'><b>'+String.fromCharCode(65+i)+'</b><span>'+pair(q.options[n])+'</span></button>';
  }).join('')+'</div>'+
  (locked?'<div class="feedback" tabindex="-1" id="feedback" role="status"><strong>'+(pending===0?tx('Correct!','¡Correcto!'):tx('Correct answer: ','Respuesta correcta: ')+pair(q.options[0]))+'</strong><p>'+pair(q.explanation)+'</p></div>':'')+
  '<div class="actions">'+button('next',position===deck.length-1?'See results':'Next question →',position===deck.length-1?'Ver resultados':'Siguiente →',false,pending===null)+button('home','End round','Terminar ronda',true)+'</div>';
 }else if(view==='results'){
  const hits=history.filter(h=>h.answer===0).length;
  const missed=history.filter(h=>h.answer!==0);
  app.innerHTML='<div class="eyebrow">'+tx('Round complete','Ronda completada')+'</div><h2 id="panel-title" tabindex="-1">'+tx('Your results','Tus resultados')+'</h2><div class="score">'+hits+' / '+history.length+' · '+Math.round(hits/history.length*100)+'%</div>'+
  (mode==='practice'?'<p>'+tx('Best streak: '+best,'Mejor racha: '+best)+'</p>':'')+
  '<ul>'+labels.map((label,i)=>{const items=history.filter(h=>h.q.domain===i);return items.length?'<li>'+pair(label)+' · '+items.filter(h=>h.answer===0).length+'/'+items.length+'</li>':''}).join('')+'</ul>'+
  '<div class="actions">'+button('home','New round','Nueva ronda')+(missed.length?button('retry','Retry missed ('+missed.length+')','Repetir errores ('+missed.length+')',true):'')+'</div>'+
  '<h3 style="margin-top:20px">'+tx('Answer review','Revisión de respuestas')+'</h3>'+history.map(({q,answer})=>'<details><summary>'+(answer===0?'✓ ':'✗ ')+pair(q.question)+'</summary><p>'+tx('Your answer: ','Tu respuesta: ')+pair(q.options[answer])+'</p><p>'+tx('Correct answer: ','Respuesta correcta: ')+pair(q.options[0])+'</p><p>'+pair(q.explanation)+'</p></details>').join('');
 }else{
  const [kind,prompt,model]=prompts[promptIndex];
  app.innerHTML='<div class="eyebrow">'+tx('Writing drills','Ejercicios escritos')+'</div><h2 id="panel-title" tabindex="-1">'+pair(kind)+'</h2><p>'+pair(prompt)+'</p><label for="draft">'+tx('Your response','Tu respuesta')+'</label><textarea id="draft"></textarea>'+
  '<details><summary>'+tx('Show response checklist','Ver lista de cotejo')+'</summary><p>'+pair(model)+'</p></details><div class="actions">'+button('prompt','Next prompt →','Siguiente consigna →')+button('home','Back to quiz setup','Volver al inicio',true)+'</div>';
  byId('draft').value=draft;
 }
 byId('official').innerHTML='<h3>'+tx('Official exam guides','Guías oficiales de examen')+'</h3><div class="resources">'+[
 ['https://www.aepa.nesinc.com/TestView.aspx?f=HTML_FRAG%2FNT051_Profile.html',['Elementary · 051','Primaria · 051']],
 ['https://www.aepa.nesinc.com/TestView.aspx?f=HTML_FRAG%2FNT052_Profile.html',['Secondary · 052','Secundaria · 052']],
 ['https://www.aepa.nesinc.com/PageView.aspx?f=GEN_Tests.html',['Find your required exams','Encuentra tus exámenes requeridos']]
 ].map(([url,name])=>'<a href="'+url+'" target="_blank" rel="noopener">'+pair(name)+' ↗</a>').join('')+'</div>';
 byId('footer').innerHTML=tx('Independent study aid with original questions based on public exam objectives. Use the official guides for sample items and confirm the tests required for your certificate.','Recurso de estudio independiente con preguntas originales basadas en objetivos públicos. Consulta las guías oficiales para ver ejemplos y confirma los exámenes requeridos para tu certificado.');
 if(focus) byId('panel-title').focus();
}
document.addEventListener('change',e=>{
 if(e.target.id==='filter') filter=e.target.value;
 if(e.target.id==='length') length=Number(e.target.value);
 if(e.target.id==='mode') mode=e.target.value;
});
document.addEventListener('input',e=>{if(e.target.id==='draft') draft=e.target.value;});
document.addEventListener('click',e=>{
 const target=e.target.closest('button');
 if(!target)return;
 const {lang,action,answer}=target.dataset;
 if(lang!==undefined){
  language=Number(lang);
  try {localStorage.setItem('desert-ready-language',lang);} catch {}
  render();byId('languages').querySelector('[data-lang="'+lang+'"]').focus();return;
 }
 if(answer!==undefined && view==='quiz' && (pending===null || mode==='mock')){
  pending=Number(answer);
  if(mode==='practice'){streak=pending===0?streak+1:0;best=Math.max(streak,best);}
  render();(byId('feedback') || document.querySelector('[data-answer="'+answer+'"]')).focus();return;
 }
 switch(action){
  case 'start': start(bank.filter(q=>filter==='all'||q.domain===Number(filter)),length); break;
  case 'retry': start(history.filter(h=>h.answer!==0).map(h=>h.q),history.length); break;
  case 'next':
   if(pending===null)return;
   history.push({q:deck[position],answer:pending});pending=null;
   if(++position===deck.length)view='results';
   break;
  case 'home': view='home'; break;
  case 'writing': view='writing'; break;
  case 'prompt': promptIndex=(promptIndex+1)%prompts.length;draft='';break;
  default:return;
 }
 render(true);
});
render();


</script></body></html>
